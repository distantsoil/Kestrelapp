        shell: pwsh
        env:
          SIGN_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          SIGN_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          SIGN_PROFILE: ${{ vars.ARTIFACT_SIGNING_TEST_PROFILE }}
        run: |
          if (-not $env:SIGN_PROFILE) { throw "no certificate profile was chosen" }
          $dir = Join-Path $env:RUNNER_TEMP "signing-meta"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          [ordered]@{
            Endpoint               = $env:SIGN_ENDPOINT
            CodeSigningAccountName = $env:SIGN_ACCOUNT
            CertificateProfileName = $env:SIGN_PROFILE
            ExcludeCredentials     = @("EnvironmentCredential", "WorkloadIdentityCredential", "ManagedIdentityCredential", "SharedTokenCacheCredential", "VisualStudioCredential", "VisualStudioCodeCredential", "AzurePowerShellCredential", "AzureDeveloperCliCredential", "InteractiveBrowserCredential")
          } | ConvertTo-Json | Set-Content -Path (Join-Path $dir "metadata.json") -Encoding utf8
      - name: List the files to sign
        # The signature budget: Basic includes 5,000 signatures a month, one per file. Only
