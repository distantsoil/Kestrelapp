          if ($catalog.Count -lt 2) { throw "the signing catalog lists $($catalog.Count) files; expected the app executables" }
          $signed = @($catalog | ForEach-Object { Join-Path $dist ($_.Trim().Substring(2).Replace("/", "\")) })
          $installers = @(Get-ChildItem -Path $dist -File -Filter "Kestrel-Setup-*.exe")
          if ($installers.Count -ne 1) { throw "found $($installers.Count) installers; expected one" }
          $signed += $installers[0].FullName
