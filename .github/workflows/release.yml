          $calls = @(Get-Content -Path $env:KESTREL_SIGN_COUNTER -ErrorAction SilentlyContinue).Count
          Write-Host "signing attempts by Inno Setup: $calls (expected $expectedInnoCalls: the installer and the uninstaller)"
          if ($calls -ne $expectedInnoCalls) { throw "Inno Setup made $calls signing attempts; expected exactly $expectedInnoCalls" }
      - name: Sign out of Azure
        if: always()
        shell: pwsh
        run: |
          az logout 2>$null
          Remove-Item -Recurse -Force (Join-Path $HOME ".azure") -ErrorAction SilentlyContinue
          exit 0
      - name: Check the signatures before the upload
        # Every file this job signed is checked before anything is uploaded, so a test signature
        # that Windows trusts can never be downloaded. The rule is packaging/signature_check.ps1,
        # the same one windows-verify uses after the install (D-REL-18z, D-REL-18zc).
        shell: pwsh
        env:
          SIGN_MODE: ${{ needs.preflight.outputs.sign_mode }}
          EXPECTED_PUBLISHER: ${{ vars.ARTIFACT_SIGNING_PUBLISHER }}
        run: |
          . (Join-Path (Get-Location) "packaging\signature_check.ps1")
          if (-not $env:EXPECTED_PUBLISHER) { throw "ARTIFACT_SIGNING_PUBLISHER is not set" }
          # The files the signing action signed (its catalog), the installer, and every file Inno
          # Setup asked to sign that is still on disk.
          $dist = Join-Path (Get-Location) "dist"
          $catalog = @(Get-Content -Path (Join-Path $dist "sign-catalog.txt") | Where-Object { $_.Trim() })
          if ($catalog.Count -lt 2) { throw "the signing catalog lists $($catalog.Count) files; expected the app executables" }
          $signed = @($catalog | ForEach-Object { Join-Path $dist ($_.Trim().Substring(2).Replace("/", "\")) })
          $installers = @(Get-ChildItem -Path $dist -File -Filter "Kestrel-Setup-*.exe")
          if ($installers.Count -ne 1) { throw "found $($installers.Count) installers; expected one" }
          $signed += $installers[0].FullName
          $innoCalls = @(Get-Content -Path (Join-Path $env:RUNNER_TEMP "inno-signing-calls.txt") -ErrorAction SilentlyContinue | Where-Object { $_.Trim() })
          foreach ($p in $innoCalls) {
            if (Test-Path -LiteralPath $p.Trim()) { $signed += (Resolve-Path -LiteralPath $p.Trim()).Path }
            else { Write-Host "signed by Inno Setup and no longer on disk (it is inside the installer): $p" }
          }
          $signed = @($signed | Select-Object -Unique)
          $bad = @()
          foreach ($f in $signed) {
            if (-not (Test-Path -LiteralPath $f)) { $bad += "${f}: missing"; continue }
            $problem = Get-KestrelSignatureProblem -Path $f -Mode $env:SIGN_MODE -Publisher $env:EXPECTED_PUBLISHER
            if ($problem) { $bad += $problem }
          }
          Write-Host "signed files checked before the upload: $($signed.Count) (mode $($env:SIGN_MODE))"
          if ($bad.Count -gt 0) { $bad | ForEach-Object { Write-Host $_ }; throw "$($bad.Count) signed file(s) failed the check; nothing was uploaded" }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-signed
          path: dist/Kestrel-Setup-*.exe
          retention-days: 1
          if-no-files-found: error


  windows-sign-test:
    name: Sign the Windows build (test profile)
    # The dry run: a manual dispatch from main, in the release-test environment, with the test
    # app registration, which holds the Signer role on the Public Trust Test profile alone. It
    # cannot obtain a credential that works on the production profile (D-REL-18q).
    needs: [preflight, windows, windows-tools]
    if: needs.preflight.outputs.sign_mode == 'test' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment: release-test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: windows-app
          path: dist/Kestrel
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: signing-kit
          path: ${{ runner.temp }}/kit
      - name: Check the signing inputs and warn about a re-run
        shell: pwsh
        env:
          SIGN_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          SIGN_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          SIGN_PROFILE: ${{ vars.ARTIFACT_SIGNING_TEST_PROFILE }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          foreach ($name in @("SIGN_ENDPOINT", "SIGN_ACCOUNT", "SIGN_PROFILE")) {
            if (-not (Get-Item -Path "Env:$name").Value) { throw "$name is empty: set the matching repository variable" }
          }
          if ($env:RUN_ATTEMPT -ne "1") {
            Write-Host "::warning::This is attempt $($env:RUN_ATTEMPT). A re-run of this job signs again and spends about 4 more signatures (D-REL-18t)."
          }
      - name: Verify every binary in the signing kit before the login
        # Fails closed: every executable file in the kit must carry a valid Authenticode
        # signature from the publisher expected for its folder, and the compiler must be the
        # pinned Inno Setup version. The hashes behind these files are pinned in windows-tools.
        shell: pwsh
        run: |
          $kit = Join-Path $env:RUNNER_TEMP "kit"
          $publishers = @{
            "signtool" = @("Microsoft Corporation", "Microsoft 3rd Party Application Component")
            "dlib"     = @("Microsoft Corporation", "Microsoft 3rd Party Application Component")
            "inno"     = @("Pyrsys B.V.")
          }
          $binaries = @(Get-ChildItem -Path $kit -Recurse -File | Where-Object { @(".exe", ".dll", ".e32", ".pyd", ".sys", ".ocx") -contains $_.Extension.ToLower() })
          if ($binaries.Count -lt 4) { throw "the signing kit holds $($binaries.Count) executable files; it is not the kit windows-tools built" }
          $bad = @()
          foreach ($file in $binaries) {
            $folder = $file.FullName.Substring($kit.Length + 1).Split("\")[0]
            $expected = $publishers[$folder]
            if (-not $expected) { $bad += "$($file.Name): unexpected folder $folder"; continue }
            $sig = Get-AuthenticodeSignature -FilePath $file.FullName
            if ($sig.Status -ne "Valid") { $bad += "$($file.Name): $($sig.Status)"; continue }
            $cn = [regex]::Match($sig.SignerCertificate.Subject, 'CN=(?<cn>[^,]+)').Groups["cn"].Value.Trim('" ')
            if ($expected -notcontains $cn) { $bad += "$($file.Name): signed by $cn"; continue }
          }
          Write-Host "signing kit binaries checked: $($binaries.Count)"
          if ($bad.Count -gt 0) { $bad | ForEach-Object { Write-Host $_ }; throw "$($bad.Count) file(s) in the signing kit are not signed by an expected publisher" }
          $iscc = Get-Item (Join-Path $kit "inno\ISCC.exe")
