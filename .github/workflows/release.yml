          Set-Content -Path (Join-Path (Get-Location) "dist\sign-catalog.txt") -Value $lines -Encoding utf8
          $others = @($found | Where-Object { $todo.FullName -notcontains $_.FullName })
          $valid = @($others | Where-Object { (Get-AuthenticodeSignature -FilePath $_.FullName).Status -eq "Valid" }).Count
          Write-Host "PE files found: $($found.Count); signing calls by the signing action: $($todo.Count) (limit $maxToSign); already validly signed by their makers: $valid; unsigned third-party files left alone: $($others.Count - $valid)"
      - name: Azure login (federated credential)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_TEST_CLIENT_ID }}
