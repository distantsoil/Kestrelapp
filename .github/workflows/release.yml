  windows-verify:
    name: Verify the signed Windows build
    # No Azure credential and no id-token here: the signed installer is installed, every PE file
    # is checked and the app is started. Each file of ours goes through
    # packaging/signature_check.ps1, the rule the signing jobs use before their upload: Valid in
    # production; in test mode UnknownError or NotTrusted with a timestamp, Valid fails the run,
    # and the signer and chain are printed (D-REL-18zc). The marker says the build is not
    # publicly trusted.
    needs: [preflight, windows-sign, windows-sign-test]
    # One of the two signing jobs is skipped by design, so a status function is needed to run
    # after a skipped need; a failed signing job still stops this one.
    if: ${{ !cancelled() && !failure() && needs.preflight.outputs.sign_mode != 'none' }}
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: windows-signed
          path: dist
      # Only for packaging/signature_check.ps1; into its own folder so it never touches dist.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          path: kestrel-src
      - name: Install, check every signature and start the app
        shell: pwsh
        env:
          SIGN_MODE: ${{ needs.preflight.outputs.sign_mode }}
          EXPECTED_PUBLISHER: ${{ vars.ARTIFACT_SIGNING_PUBLISHER }}
        run: |
          . (Join-Path $env:GITHUB_WORKSPACE "kestrel-src\packaging\signature_check.ps1")
          if (-not $env:EXPECTED_PUBLISHER) { throw "ARTIFACT_SIGNING_PUBLISHER is not set" }
          $installer = (Get-ChildItem dist\Kestrel-Setup-*.exe | Select-Object -First 1).FullName
          $target = Join-Path $env:RUNNER_TEMP "kestrel-signed-install"
          $install = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$target" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "the silent install exited with code $($install.ExitCode)" }
          # What is ours: the installer and the executables Kestrel and Inno Setup put at the top of
          # the install folder. Each goes through the signing rule (a timestamp in both modes, our
          # publisher name in production).
          $ours = @(Get-Item $installer) + @(Get-ChildItem -Path $target -File -Filter "*.exe")
          $bad = @()
          # Four files must exist and be among the ones checked below, so an install that left
          # one out cannot pass by having nothing to check.
          $required = @($installer, (Join-Path $target "Kestrel.exe"), (Join-Path $target "kestrel-cli.exe"), (Join-Path $target "unins000.exe"))
          foreach ($r in $required) {
            if (-not (Test-Path $r)) { $bad += "${r}: missing" }
            elseif ($ours.FullName -notcontains (Resolve-Path $r).Path) { $bad += "${r}: not among the files checked" }
          }
          foreach ($f in $ours) {
            $problem = Get-KestrelSignatureProblem -Path $f.FullName -Mode $env:SIGN_MODE -Publisher $env:EXPECTED_PUBLISHER
            if ($problem) { $bad += $problem }
          }
          # Everyone else's files are verified, not signed: a valid signature must still be valid,
          # and a file its maker never signed is reported but is not ours to fix.
          $theirs = @(Get-ChildItem -Path $target -Recurse -File | Where-Object { @(".exe", ".dll", ".pyd") -contains $_.Extension.ToLower() } | Where-Object { $ours.FullName -notcontains $_.FullName })
          $theirValid = 0
          $theirUnsigned = 0
          foreach ($f in $theirs) {
            $status = (Get-AuthenticodeSignature -FilePath $f.FullName).Status
            if ($status -eq "Valid") { $theirValid++ } elseif ($status -eq "NotSigned") { $theirUnsigned++ } else { $bad += "$($f.FullName): $status" }
          }
          Write-Host "Kestrel-signed files checked: $($ours.Count); third-party files validly signed by their makers: $theirValid; unsigned third-party files left as their makers shipped them: $theirUnsigned"
          if ($bad.Count -gt 0) { $bad | ForEach-Object { Write-Host $_ }; throw "$($bad.Count) file(s) are not signed as required" }
          $env:KESTREL_DATA_HOME = "$env:RUNNER_TEMP\kestrel-home"
          & (Join-Path $target "kestrel-cli.exe") version
          if ($LASTEXITCODE -ne 0) { throw "the signed app did not start" }
      - name: Signing marker
        shell: pwsh
        env:
          SIGN_MODE: ${{ needs.preflight.outputs.sign_mode }}
        run: |
          if ($env:SIGN_MODE -eq 'test') {
            Set-Content -Path dist\SIGNING-windows.txt -Value "windows: unsigned: built with the Artifact Signing test profile, which Windows does not trust; a version tag signs with the public profile"
          } else {
            Set-Content -Path dist\SIGNING-windows.txt -Value "windows: signed"
          }
          Get-Content dist\SIGNING-windows.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: Kestrel-windows
          path: |
            dist/Kestrel-Setup-*.exe
            dist/SIGNING-windows.txt
          if-no-files-found: error

  release:
    name: GitHub Release
    # The two signing jobs are skipped when signing is not configured; a failed one still blocks.
    needs: [preflight, linux, macos, macos-sign, macos-sign-test, macos-sign-check, windows, windows-tools, windows-sign, windows-sign-test, windows-verify]
    if: github.event_name == 'push' && needs.preflight.outputs.is_version_tag == 'true' && !cancelled() && !failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: artifacts
          # Only the installers; the app folder and signed installer handed between the Windows
          # jobs are named differently and never reach the release.
          pattern: Kestrel-*
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum Kestrel-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes and signing status
        # One SIGNING.txt from the three per-platform markers. RELEASE_BODY.md is the CHANGELOG
        # section for this tag (the step fails if it is missing or empty) followed by the same
        # signing lines, so nobody downloads an unsigned installer without being told.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ALLOW=""
          case "$VERSION" in *-*) ALLOW="--allow-unreleased" ;; esac
          python3 scripts/changelog_section.py "$VERSION" $ALLOW > artifacts/RELEASE_NOTES.md
          cd artifacts
          cat SIGNING-windows.txt SIGNING-macos.txt SIGNING-linux.txt > SIGNING.txt
          {
            cat RELEASE_NOTES.md
            echo
            echo "## Code signing"
            echo
            sed 's/^/- /' SIGNING.txt
            echo
          } > RELEASE_BODY.md
          rm RELEASE_NOTES.md
          cat RELEASE_BODY.md
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        id: gh_release
        with:
          # A draft first: immutable releases refuse uploads once published.
          draft: true
          name: Kestrel ${{ github.ref_name }}
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: artifacts/RELEASE_BODY.md
          files: |
            artifacts/Kestrel-Setup-*.exe
            artifacts/Kestrel-*.dmg
            artifacts/Kestrel-*-x86_64.AppImage
            artifacts/SHA256SUMS.txt
            artifacts/SIGNING.txt
      - name: Publish the release
        # Every installer is attached, so the release can now be published (and locked).
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.gh_release.outputs.id }}
        run: |
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::The release step returned no release id, so nothing was published."
            exit 1
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false

  website:
    name: Publish latest.json
    needs: [preflight, release]
    # A real version-tag push only (never a dry run), and never a prerelease: the feed is what
    # installed apps offer as an update.
    if: github.event_name == 'push' && needs.preflight.outputs.is_version_tag == 'true' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # WEBSITE_TOKEN is only ever checked for (preflight) and handed to the site checkout below,
      # which persists it for the push. It is never an env: value.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Install
        run: |
          uv python install 3.12
          uv sync --extra dev
      - name: Fetch checksums and signing status
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS.txt --pattern SIGNING.txt
      - name: Build latest.json
        env:
          # The tag's UTC date from preflight: the same value the CHANGELOG date was checked
          # against, so a run that reaches this job after midnight cannot disagree with it.
          RELEASED_AT: ${{ needs.preflight.outputs.released_at }}
        run: |
          uv run python scripts/build_latest_json.py \
            --version "${GITHUB_REF_NAME#v}" \
            --published-at "$RELEASED_AT" \
            --changelog CHANGELOG.md \
            --sums SHA256SUMS.txt \
            --signing SIGNING.txt \
            --assets-base "${{ github.server_url }}/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}" \
            --out latest.json
          cat latest.json
      # The same latest.json, handed to the homebrew-tap job (#201).
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: latest-json
          path: latest.json
          if-no-files-found: error
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ vars.WEBSITE_REPO || 'distantsoil/kestrelapp-site' }}
          token: ${{ secrets.WEBSITE_TOKEN }}
          path: site
      - name: Commit and push
        run: |
          cp latest.json "site/${{ vars.WEBSITE_LATEST_PATH || 'latest.json' }}"
          cd site
          git add -A
          if git diff --cached --quiet; then
            echo "latest.json is already current; nothing to push"
            exit 0
          fi
          git config user.name "kestrel-release-bot"
          git config user.email "kestrel-release-bot@users.noreply.github.com"
          git commit -m "release: $GITHUB_REF_NAME"
          git push

  homebrew-tap:
    name: Update the Homebrew tap
    needs: [preflight, release, website]
    # A pushed stable version tag only, after the release and latest.json are published (#201,
    # D-REL-616). Never a dry run, a prerelease or a pull request. The tap token lives in the
    # release environment and is only ever the token input of the tap checkout.
    if: github.event_name == 'push' && needs.preflight.outputs.is_version_tag == 'true' && !contains(github.ref_name, '-') && (startsWith(github.ref, 'refs/tags/v0') || startsWith(github.ref, 'refs/tags/v1') || startsWith(github.ref, 'refs/tags/v2') || startsWith(github.ref, 'refs/tags/v3') || startsWith(github.ref, 'refs/tags/v4') || startsWith(github.ref, 'refs/tags/v5') || startsWith(github.ref, 'refs/tags/v6') || startsWith(github.ref, 'refs/tags/v7') || startsWith(github.ref, 'refs/tags/v8') || startsWith(github.ref, 'refs/tags/v9'))
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: latest-json
          path: feed
      - name: Render the cask
        id: cask
        # The runner's own python3, standard library only: no package is installed in this job.
        run: |
          python3 scripts/homebrew_cask.py --latest feed/latest.json --tag "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --license LICENSE.md --out tap-update
      - name: The tap token is set
        # A boolean only. Without the token the checkout below would fail with a generic error.
        if: steps.cask.outputs.publish == 'true'
        env:
          HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
        run: |
          if [ "$HAS_TAP_TOKEN" != "true" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set in the release environment, so the Homebrew tap was not updated. Add it (docs/RELEASING.md, Homebrew tap) and re-run this job."
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: steps.cask.outputs.publish == 'true'
        with:
          repository: distantsoil/homebrew-kestrel
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Commit and push
        if: steps.cask.outputs.publish == 'true'
        run: |
          mkdir -p tap/Casks
          cp tap-update/Casks/kestrel.rb tap/Casks/kestrel.rb
          cp tap-update/LICENSE tap/LICENSE
          cmp LICENSE.md tap/LICENSE
          cd tap
          git add Casks/kestrel.rb LICENSE
          if git diff --cached --quiet; then
            echo "The tap already has this version; nothing to push."
            exit 0
          fi
          git config user.name "kestrel-release-bot"
          git config user.email "kestrel-release-bot@users.noreply.github.com"
          git commit -m "kestrel ${GITHUB_REF_NAME#v}"
          git push
