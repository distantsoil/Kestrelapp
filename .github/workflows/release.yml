          $env:KESTREL_SIGN_META = Join-Path $env:RUNNER_TEMP "signing-meta\metadata.json"
          $env:KESTREL_SIGN_COUNTER = Join-Path $env:RUNNER_TEMP "inno-signing-calls.txt"
          $env:Path = (Join-Path $kit "inno") + ";" + $env:Path
          # $q is Inno's quote and $f its file name; single quotes keep PowerShell from expanding them.
          $env:KESTREL_INNO_SIGNTOOL = ('powershell.exe -NoProfile -ExecutionPolicy Bypass -File $q{0}$q $f' -f (Join-Path (Get-Location) "packaging\sign_call.ps1"))
          packaging\build_windows.ps1 -SkipBuild
