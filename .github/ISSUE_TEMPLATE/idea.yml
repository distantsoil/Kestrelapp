name: Suggest an idea
description: Something that would make Kestrel more useful for you.
title: "Idea: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. **Everything you post here is public**, so describe the idea without your personal details or the jobs you are applying to.
  - type: textarea
    id: trying
    attributes:
      label: What were you trying to do?
      placeholder: For example, "Compare two offers side by side on my phone."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would have made it easier?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I have left out my personal details.
          required: true
