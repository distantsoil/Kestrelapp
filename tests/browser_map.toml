# Which browser test files cover which UI files (D-TEST-7 A). scripts/check.py runs the browser
# files selected here for every UI file the branch changed. A UI file that matches no rule fails
# the gate, and tests/test_browser_map.py fails when a file in the repo matches nothing, so this
# map stays complete.
#
# Patterns are fnmatch globs over repo-relative posix paths; "*" also crosses "/". A file takes
# the union of every rule it matches. Browser file names are given without the leading "tests/".
# The name "@shell" expands to the [shell] list below.

[shell]
# Tests of the frame every page sits in: window controls and entrance, responsive rail and bottom
# bar, in-place navigation, the modal layer, the toast, the design system cascade, the small
# surfaces, and the busy bar. A change to shared plumbing runs all of them.
files = [
  "test_shell_frame_browser.py",
  "test_shell_responsive_browser.py",
  "test_nav_browser.py",
  "test_modal_layer_browser.py",
  "test_toast_undo_browser.py",
  "test_ui_browser.py",
  "test_surfaces_browser.py",
  "test_busy_idle_browser.py",
]

[soak]
# Browser files that run only in the soak tier (docs/handoff/SOAK.md), never in the gate: they are
# skipped unless KESTREL_LAYOUT_CRAWL=1 is set, so selecting them would give "no test passed".
# Listing a file here is the only way to keep it out of the rules above without failing
# tests/test_browser_map.py; scripts/diff_gate.py never selects these.
files = [
  "test_layout_crawl_browser.py",
]

