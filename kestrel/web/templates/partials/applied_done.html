{# The "I applied" one-click answer, kept for callers that post the quick route (D-UI-51). The
   board's own button now opens the form in the panel. #}
<div class="ap-applied-done" id="applied-{{ pid }}" data-testid="applied-done">
  <button class="k-btn k-btn--sm k-btn--done" type="button" disabled>{{ done }}</button>
  <span class="k-muted">Moving to {{ moving_to }} &middot; recorded today, follow up in 7 days. Use the card's Stage label to change it.</span>
</div>
