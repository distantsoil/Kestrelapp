{# The "Applied?" button after its one click (D-UI-51): green, with the way to a different date.
   Asks the board to refresh a moment later, which moves the card to its new column. #}
<div class="applied-quick done" id="applied-{{ pid }}" data-testid="applied-done"
     hx-get="/pursuits?view=kanban&track={{ track }}" hx-trigger="load delay:2s"
     hx-target="#board" hx-swap="innerHTML">
  <button class="btn small good" type="button" disabled draggable="false">{{ done }}</button>
  <div class="meta">Moving to {{ moving_to }} &middot; recorded today, follow up in 7 days. Use the
    card's Stage menu to change it.</div>
</div>
