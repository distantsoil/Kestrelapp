{% if notice %}
{# Good news, not a warning: the indigo guide-strip style (D-UI-47), not the amber warnbox. #}
<div class="guide-strip" role="status" data-testid="announcement" data-announcement-id="{{ notice.id }}">
  <span class="guide-text">{{ notice.text }}</span>
  <button class="guide-x" type="button" aria-label="Got it, hide this notice"
          hx-post="/announcements/{{ notice.id }}/dismiss"
          hx-target="#announcement-slot" hx-swap="innerHTML">Got it</button>
</div>
{% endif %}
