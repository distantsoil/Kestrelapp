{% if notice %}
{# Good news, not a warning: the quiet info strip (D-UI-152), not the amber warning box. #}
<link rel="stylesheet" href="/static/css/pages/surfaces.css">
<div class="sf-notice" role="status" data-testid="announcement" data-announcement-id="{{ notice.id }}">
  <span class="sf-msg">{{ notice.text }}</span>
  <button class="k-btn k-btn--sm" type="button" aria-label="Got it, hide this notice"
          hx-post="/announcements/{{ notice.id }}/dismiss"
          hx-target="#announcement-slot" hx-swap="innerHTML">Got it</button>
</div>
{% endif %}
