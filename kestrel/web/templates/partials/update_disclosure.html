<div class="card" data-testid="update-disclosure" style="margin-bottom:12px">
  <p style="margin:0 0 .6rem">Kestrel checks kestrelapp.co once a day for a newer version. Nothing about you is sent. Kestrel never downloads or installs anything; you choose if and when to update.</p>
  <p style="display:flex;gap:.5rem;margin:0">
    <button class="btn primary" type="button" hx-post="/updates/disclosure/ok"
            hx-target="#disclosure-slot" hx-swap="innerHTML">OK</button>
    <button class="btn" type="button" hx-post="/updates/disclosure/off"
            hx-target="#disclosure-slot" hx-swap="innerHTML">Turn off</button>
  </p>
</div>
