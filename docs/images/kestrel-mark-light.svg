<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Kestrel">
  <title>Kestrel</title>
  <!-- The light tray variant of the Windhover mark (D-UI-13): a paper tile with the indigo bird,
       for light taskbars where the indigo tile would read as a notification. The bird gradient is
       the same indigo pair as the ground of kestrel-mark.svg (D-UI-53; orange is retired). -->
  <defs>
    <linearGradient id="bird" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6470E0"/>
      <stop offset="1" stop-color="#3A44A8"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="504" height="504" rx="110" fill="#FFFFFF" stroke="#4F5BD5" stroke-width="8"/>
  <path d="M256 92 C270 92 282 102 284 118 C286 134 292 142 300 150 C348 134 420 112 472 116 C452 170 380 220 312 236 C306 266 300 294 294 318 C324 326 348 352 358 392 C324 398 290 400 256 400 C222 400 188 398 154 392 C164 352 188 326 218 318 C212 294 206 266 200 236 C132 220 60 170 40 116 C92 112 164 134 212 150 C220 142 226 134 228 118 C230 102 242 92 256 92 Z" fill="url(#bird)"/>
</svg>
